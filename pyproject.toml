[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-admin-agent"
dynamic = ["version"]
description = "An always-present chat-agent sidebar in the Django admin, powered by django-ag-ui."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "django-admin", "ag-ui", "pydantic-ai", "agent", "llm", "ai", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    # Floored at 0.48 for the chart pipeline the vendored web component now
    # draws. 0.47 is where ``chart_activity`` first exists, so below it there is
    # no supported way to put a chart on this sidebar at all; 0.48 is where the
    # server refuses a payload the browser would silently discard. The second
    # half is the load-bearing one: a discarded chart still settles its tool call
    # successfully, so the model reports a visual that is not on screen. Shipping
    # a chart-drawing bundle over a server that emits undrawable specs would
    # rebuild that exact failure one layer up, which is the failure this floor
    # and the browser suite exist to stop.
    #
    # Carried along by the same claim, and the reason the previous two floors
    # were raised: 0.45's attachment-store fix (a store that raised where its
    # contract returns ``None``, and a dedup that adopted a missing blob) and
    # 0.46's inline read-back budget, which closed the band of files that
    # uploaded successfully and could never be read.
    #
    # The floor moves here because this package reaches most of the substrate
    # through django-ag-ui rather than importing it.
    #
    # Raised to 0.49 for the ``RUN_ERROR`` redaction, which stops a failing run
    # streaming ``str(exception)`` to the browser when
    # ``TOOL_FAILURE["INCLUDE_DETAIL"]`` is off. That was a latent hole here
    # until the agent runtime's floor below moved, on django-pydantic-agent: from 0.18 a
    # ``PermissionDenied`` ends the run instead of being converted into a tool
    # failure, so the permission gate's message started taking the ``RUN_ERROR``
    # path -- the one path no failure policy covered. On 0.48 it reached the
    # transcript verbatim. The two floors have to move together, and the
    # browser suite is what showed it: the Python tests assert
    # ``PermissionDenied`` at the tool boundary, below both layers.
    # 0.53 routes a delegated sub-agent's progress onto the SSE stream and stamps
    # every CUSTOM event, and its spec extras carry drf-services>=0.49 for the
    # bounded schema recursion. The vendored component here draws that progress,
    # so a server below the floor would leave the panel with nothing to render.
    # 0.55 refuses an endpoint with no model at the mount rather than one request
    # later, and this package is the reason that timing matters: the sidebar is
    # mounted by ``AdminAgentServer`` inside ``admin.site.urls``, so a project
    # that installs it and forgets ``DJANGO_AG_UI["MODEL"]`` used to get a
    # working admin and a chat that failed on its first message, in a stream,
    # with the panel already open. It now fails where every other Django
    # misconfiguration fails.
    #
    # The floor before this one is what makes the vendored component's tool-card
    # rendering reachable rather than decorative. The bundle pinned below reads
    # an ``outcome`` field on ``TOOL_CALL_RESULT`` to settle a card to error or
    # declined instead of done, and that floor is the release that puts the
    # field on the wire. Below it this package would ship a client watching for
    # something its own server never sends, and every refused tool call would go
    # on rendering as a successful one -- the two halves are only right
    # together, which is why the pin and the floor moved in one release.
    #
    # 0.59 was adopted for documentation rather than behaviour, and was worth
    # stating anyway. It carries the correction to
    # ``FORWARD_REASONING``, which had been documented as though a
    # chain-of-thought could only reach a browser once an operator enabled a
    # thinking budget. It cannot be relied on: some models reason by default and
    # cannot be told not to. This package decides who is looking -- the sidebar
    # renders reasoning to every staff member who can open a changelist -- so a
    # reader following our docs to the upstream setting should land on the page
    # that says so, not on the one that talked them out of checking.
    #
    # 0.60 extended the ``outcome`` argument above to a tool
    # bridged from ``AdminAgentServer(drf_mcp_server=...)``. 0.60 floors
    # django-pydantic-agent at 0.23, whose bridge raises ``ToolFailed`` for a call
    # the server refuses. Below it the refusal came back as the tool's returned
    # value, so ``TOOL_CALL_RESULT`` carried no ``outcome`` and the vendored card
    # settled a refused call to done -- the same false success, one route over.
    # django-ag-ui's own suite holds that, driving a refused bridged tool through
    # a whole session.
    #
    # 0.61 was the previous floor, about a run surviving the network between this
    # admin and the model. Its SSE response carries a heartbeat, so the silence
    # while a model thinks or a slow admin tool runs stops reading as a dead
    # connection to the proxies in front of a Django deployment: an AWS
    # Application Load Balancer and nginx each cut an idle stream at 60 seconds by
    # default, and a sidebar answering a real question is regularly quieter than
    # that. Below the floor the connection is closed mid-run and the answer never
    # arrives, which is indistinguishable from the agent failing. 0.61 also stops
    # a delegated sub-agent running on after the client that asked for it has
    # gone -- in an admin that is the ordinary case rather than an edge one, since
    # the sidebar lives on a changelist and a user clicks through to the next page
    # mid-run.
    #
    # 0.62 carried the two floors above into the transport itself: it declares
    # django-pydantic-agent 0.25 and, in its ``[drf-mcp]`` extra,
    # djangorestframework-mcp-server 0.48. That is the pair a bridged sidebar
    # needs for a tool to come and go with its operation condition while a
    # conversation runs, and for the agent to be told the reason it went. The
    # transport is what constructs the bridge from the ``drf_mcp_server=`` this
    # package forwards, so a project resolving the transport lower takes the two
    # rows above and still gets a bridge built the old way.
    #
    # 0.63 is the other half of the bundle pinned in the Makefile, and neither
    # is safe without the other. That bundle is built on the AG-UI 1.0 client,
    # which deletes every field its schema does not declare from an event it
    # receives and from a request it sends. Two of this sidebar's fields were
    # exactly that: the ``outcome`` argued for above, and the refs to files a
    # user attached, which the upload view hands back and the next message
    # carries. 0.63 moves both into the ``metadata`` the 1.0 schema does
    # declare. Below it the refused-tool card goes back to settling as done, the
    # same false success as before the ``outcome`` floor, and an attached file
    # never reaches the agent at all -- the upload succeeds, the chip shows, and
    # the model is asked about a document it was never given. The browser suite
    # holds the first half: ``tests/e2e/test_refused_tool_card.py`` fails
    # against 0.62 with this bundle, finding the card settled to done, and it is
    # the only test that loads both.
    #
    # 0.64 carries that ``outcome`` onto the stored thread.
    # A project that mounts a conversation store gets a thread index in the
    # sidebar, and a reload then replays the server's copy of the conversation
    # rather than the tab's. Below 0.64 that copy was pydantic-ai's dump, which
    # drops the outcome, so a call the sidebar had just shown as refused came
    # back from the next page load as done -- and in an admin every click is a
    # page load. The reload test in ``tests/e2e/test_refused_tool_card.py``
    # fails against 0.63 with this bundle.
    #
    # 0.65 carried the ``[mcp]`` band below into the transport again, as 0.62 did:
    # it declared django-pydantic-agent 0.26 and, in its ``[drf-mcp]`` extra,
    # djangorestframework-mcp-server 0.49. That was the pair in which a field
    # selection a bridged tool's serializer refuses while rendering -- one written
    # against a paged changelist's envelope rather than its rows -- reaches the
    # model as one retry naming the argument, where below it the call failed with
    # its reason withheld and the model had nothing to correct. The retry streams as
    # a ``TOOL_CALL_RESULT`` with no ``outcome``, so the card beside the changelist
    # settles and the next call returns the page. It buys no code in the transport
    # itself; it is taken so the transport that builds the bridge does not resolve
    # below the band the bridge needs.
    #
    # The current floor is 0.73, the release taking ``mcp_server=``, a
    # django-spec-mcp server bridged in process, beside ``drf_mcp_server=`` kept
    # one minor as its deprecated alias. ``AdminAgentServer`` names both keywords
    # and forwards them, so below 0.73 constructing it is refused as an
    # unexpected ``mcp_server``. It is also the version the ``[mcp]`` extra
    # floors, and one lock holds one version, so the lowest-declared-versions
    # suite runs 0.73 whatever this row says: a lower floor would be a claim no
    # test reads. 0.73 requires django-spec-agents 0.6.0 and pydantic-ai 2.63;
    # the row below moves with it.
    #
    # 0.71 was the previous floor, the release that requires pydantic-ai 2.58 and
    # Python 3.11. 2.58 is the first release past GHSA-5pfm-2g3g-gh85, which is
    # reachable through the AG-UI adapter this sidebar serves on, and a Python
    # 3.10 install could not reach it, so this package drops 3.10 with the floor:
    # a lock on 3.10 resolved pydantic-ai 2.54.0. django-spec-agents 0.5.0 moves
    # with it, requiring the same pydantic-ai and Python. Subsumed.
    #
    # 0.70 was the previous floor, the release that runs on django-spec-agents
    # 0.2.0, which the row below now declares; the two move together. 0.69.0
    # imports drf-services for its ``service_specs=`` pre-check and 0.69.1 caps
    # django-spec-agents below 0.2.0, so below this floor a resolve either breaks
    # ``service_specs=`` or walks the runtime back below the ``AgentDeps`` this
    # package builds. From 0.70 the transport's default deps carry the run's
    # request in ``call_context`` for the spec toolset, and ``build_admin_deps``,
    # which replaces that default, carries it the same way.
    #
    # 0.69 was the previous floor, the release that runs on django-spec-agents in
    # place of django-pydantic-agent. Below it the transport hands back the old
    # package's ``AgentDeps`` while this package builds the new one. It also
    # floors its ``[drf-mcp]`` extra at 0.53.1, where a selector raising
    # ``Http404`` is a missing row on that route as it is on the other.
    #
    # 0.68.1 was the previous floor, a patch over 0.68, taken for the checkpoint panel this
    # sidebar mounts when a step store is configured (``data-runs-url``): each
    # run in it is named by the prompt that run answered. Below it every run in a
    # conversation, resumed and forked ones included, was named by the
    # conversation's opening line, because a run's snapshot holds the whole
    # thread, so a staff user choosing which run to resume or fork had nothing to
    # tell them apart by. The preview is computed when ``runs/`` is read, so runs
    # recorded before an upgrade are named correctly too. Subsumed.
    #
    # 0.68 was the previous floor, which carries the next band into the transport
    # and is what the two below it need to be felt in a sidebar: it declares
    # django-pydantic-agent 0.28 and floors the ``[drf-mcp]`` extra's
    # djangorestframework-mcp-server at 0.52 and the ``[spec-tools]`` extra's
    # djangorestframework-pydantic-ai at 0.35, which move together. A call that
    # leaves out a required argument is worded the same way whichever route serves
    # the tool, so a staff user asking the chat beside a changelist for a change
    # that names no row is told ``Missing required argument(s): `pk`.`` once, and
    # the next call reaches the row. Below it the ``drf_mcp_server=`` route said
    # ``Invalid arguments`` and left the names to a field detail. It also turns
    # more refusals into retries rather than failed calls with their text
    # withheld, and refuses at startup a bridged tool that could never serve a
    # call, a list selector taking ``page`` or ``limit`` among them, so an
    # ``MCPServer`` handed in with one now fails when the project starts rather
    # than on every call the model makes. The retry streams as a
    # ``TOOL_CALL_RESULT`` with no ``outcome``, so the card settles.
    #
    # 0.67 was the previous floor, which carried the band before into the
    # transport: it
    # declares django-pydantic-agent 0.27 and, through the pair 0.66 moved, the
    # ``[drf-mcp]`` extra's djangorestframework-mcp-server 0.50 with the
    # ``[spec-tools]`` extra's djangorestframework-pydantic-ai 0.33. That is the
    # pair in which a bridged tool's input schema requires what a call needs, so
    # a staff user asking the chat beside a changelist to change one row is told
    # which argument names it, and a call that leaves it out is one retry naming
    # the argument rather than a failed call with its reason withheld and an
    # instruction not to try again. The retry streams as a ``TOOL_CALL_RESULT``
    # with no ``outcome``, so the card settles and the next call reaches the row.
    #
    # What 0.67 bought on its own was the pydantic-ai an install resolves. It depends
    # on ``pydantic-ai-slim[ui]`` where it had ``[ag-ui]``, and from 2.47 the
    # ``[ag-ui]`` extra caps ``ag-ui-protocol`` below 1.0 while the transport has
    # needed 1.0 since 0.63. A resolver satisfies both by holding pydantic-ai-slim
    # at 2.46 and says nothing, so below this floor every admin install, and this
    # repo's own lock, ran an older pydantic-ai than the one the transport and the
    # package above it are tested against. 0.67 is the floor at which an install
    # reaches the pydantic-ai that django-pydantic-agent 0.27's tool-hook ordering
    # targets. 0.67's floor alone did not move a resolved install, because 2.46
    # still satisfied the transport's own pydantic-ai-slim floor; an upgrader named
    # ``pydantic-ai-slim`` in the upgrade. 0.71 does move it: it requires
    # ``pydantic-ai-slim[ui]>=2.58``.
    "django-ag-ui>=0.73.0",
    # The one exception, and so a declared dependency rather than a transitive
    # one: ``AgentDeps`` is imported directly to bind the acting admin request
    # onto the run's deps, and django-ag-ui takes that type and hands it back
    # without re-exporting it. django-spec-agents is the agent runtime that
    # merged django-pydantic-agent with djangorestframework-pydantic-ai, and
    # 0.1.0 is the release carrying the import paths this package and
    # django-ag-ui read. It carries django-pydantic-agent 0.28.2's host and its
    # tests across, so everything earlier floors of the old package bought
    # holds here: the tool
    # guard reading both destructive vocabularies, the bridge following tool
    # availability on every step, the tool-failure policy outermost and the audit
    # capability innermost. It also offers a registry tool under its registered
    # name, so a ``TOOL_GUARD`` gate and an approval prompt keyed by that name
    # now meet the name the model calls. Floored at 0.2.0, where ``AgentDeps``
    # first carries ``call_context``, which ``build_admin_deps`` fills with the
    # acting request, and the release django-ag-ui's floor above runs on. Raised
    # to 0.5.0 with that floor, for the pydantic-ai 2.58 and Python 3.11 it
    # requires. Raised to 0.6.0 with the row above, which requires it: 0.6.0
    # carries the ``MCPToolset`` the ``mcp_server=`` bridge builds.
    "django-spec-agents>=0.6.0",
]

[project.optional-dependencies]
# For ``AdminAgentServer(mcp_server=...)``: a django-spec-mcp ``MCPServer``'s
# tools, exposed to the agent in-process through django-spec-agents'
# ``MCPToolset``, beside the built-in tools. It is that direction only; nothing
# here serves the admin's own tools over MCP. django-ag-ui's ``[mcp]`` extra is
# what installs the bridge and django-spec-mcp, so this extra names it rather
# than either package: the transport decides which spec-mcp its bridge reads.
# Floored at 0.73.0, the first django-ag-ui taking ``mcp_server=``; below it the
# keyword is refused as unexpected.
mcp = ["django-ag-ui[mcp]>=0.73.0"]
# Deprecated, and removed in the next minor: the route ``[mcp]`` was until this
# release, for ``AdminAgentServer(drf_mcp_server=...)`` with a
# djangorestframework-mcp-server ``MCPServer``, which warns
# ``DeprecationWarning``. The line is the one ``[mcp]`` carried, so a project
# moving its extra's name keeps the install it had. Floored at 0.53.1, where a
# selector raising ``Http404`` answers not found: a missing row, where 0.53.0
# served a LIST's as a successful empty list. It is the floor django-ag-ui's own
# ``[drf-mcp]`` extra declares.
drf-mcp = ["djangorestframework-mcp-server>=0.53.1"]

[project.urls]
Homepage = "https://github.com/Artui/django-admin-agent"
Repository = "https://github.com/Artui/django-admin-agent"
Issues = "https://github.com/Artui/django-admin-agent/issues"

[tool.hatch.version]
path = "django_admin_agent/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["django_admin_agent"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    # Declared rather than inherited from pre-commit: tests/test_ci_workflows.py
    # parses the workflow files, and a transitive dependency is one upstream
    # release away from not being there.
    "pyyaml>=6.0",
    # The spec toolset, so tests/test_spec_request.py can drive a
    # ``service_specs=`` run through the sidebar: the default install has no
    # django-service-specs, and a deps record that holds the request proves
    # nothing about the callable that is meant to receive it. The floor is the
    # runtime dependency's above. And the ``[mcp]`` bridge, so
    # tests/test_spec_mcp_server.py serves a django-spec-mcp server through the
    # sidebar in every cell of the matrix rather than only where an extra is
    # installed; the ``[mcp]`` extra above floors it.
    "django-ag-ui[specs,mcp]",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
e2e = [
    "django-unfold>=0.81.0",
    "playwright>=1.60.0",
    "pytest-playwright>=0.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
# The default suite is the fast, 100%-covered unit tests. The browser e2e
# suite (tests/e2e) runs separately via `make test-e2e` with its own settings.
addopts = "--cov=django_admin_agent --cov-report=term-missing --cov-fail-under=100 --ignore=tests/e2e"
testpaths = ["tests"]
markers = ["e2e: browser end-to-end tests (Playwright + live server)"]

[tool.coverage.run]
branch = true
source = ["django_admin_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package uses ``TypeVar`` + ``Generic[T]``; without
    # these three, ``ruff --fix`` rewrites code *into* the syntax CLAUDE.md
    # forbids.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_admin_agent"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./django_admin_agent"]

[tool.bumpversion]
current_version = "0.58.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_admin_agent/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-admin-agent/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-admin-agent/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-admin-agent/compare/v{current_version}...v{new_version}"""
