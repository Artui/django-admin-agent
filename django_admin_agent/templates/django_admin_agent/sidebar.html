{% load static %}
<ag-ui-chat
  id="django-admin-agent"
  endpoint="{{ endpoint }}"
  title-text="{{ title }}"
  data-auto-confirm="{{ auto_confirm|yesno:'true,false' }}"
  data-tool-display="{{ tool_display }}"
  data-message-actions="{{ message_actions }}"
  data-slash-commands="true"
  {% if theme %}theme="{{ theme }}"{% endif %}
  {% if density %}density="{{ density }}"{% endif %}
  {% if placement %}placement="{{ placement }}"{% endif %}
  {% if side %}data-side="{{ side }}"{% endif %}
  {% if text_animation %}data-text-animation="{{ text_animation }}"{% endif %}
  {% if strings_json %}data-strings="{{ strings_json }}"{% endif %}
  {% if icon_url %}data-icon-url="{{ icon_url }}"{% endif %}
  {% if tools_url %}data-tools-url="{{ tools_url }}"{% endif %}
  {% if threads_url %}data-threads-url="{{ threads_url }}"{% endif %}
  {% if runs_url %}data-runs-url="{{ runs_url }}"{% endif %}
  {% if attachments_url %}data-attachments-url="{{ attachments_url }}"{% endif %}
  {% if attachment_max_bytes %}data-attachment-max-bytes="{{ attachment_max_bytes }}"{% endif %}
  {% if attachment_accept %}data-attachment-accept="{{ attachment_accept }}"{% endif %}
  {% if transcribe_url %}data-transcribe-url="{{ transcribe_url }}"{% endif %}
  {% if start_open %}data-start-open=""{% endif %}
  {% if not chat_surface_tools %}data-chat-surface-tools="false"{% endif %}
  {% if not launcher_drag %}data-launcher-drag="false"{% endif %}
  {% if theme_toggle %}data-theme-toggle=""{% endif %}
  {% if user_key %}user-key="{{ user_key }}"{% endif %}
  data-admin-base="{{ admin_base_url }}"></ag-ui-chat>
{{ route_map|json_script:"django-admin-agent-routes" }}
{{ skills|json_script:"django-admin-agent-skills" }}
<script type="module" src="{{ bootstrap_url }}"></script>
