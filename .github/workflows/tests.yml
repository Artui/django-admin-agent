name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA rather than a tag: a tag is mutable, and an
# action owner (or anyone who takes over the account) can silently repoint one at
# new code that then runs with this workflow's token. The trailing version comment
# is not decoration -- Dependabot reads it to know which release the SHA is, and
# rewrites both together when a newer one ships.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check --diff .
      - name: ty
        run: uv run ty check django_admin_agent

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install with docs group
        run: uv sync --all-groups
      - name: mkdocs build --strict
        run: DJANGO_SETTINGS_MODULE=tests.conftest_settings uv run mkdocs build --strict

  floor:
    name: lowest declared versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # A floor is a claim about the *oldest* version that works, and a lockfile
      # can only ever check the newest. Development and CI both resolve the
      # newest in-range dependency, so every gate passes while a consumer whose
      # own constraints pull an older one gets a package that does not import.
      #
      # That has already happened in this ecosystem: a sibling declared
      # pydantic-ai >=2 while importing a symbol that first exists in 2.16, and
      # the only thing that found it was a downstream consumer resolving from
      # scratch -- this package.
      #
      # `lowest-direct` pins every *declared* dependency to the bottom of its
      # window while letting transitives resolve normally, so this asserts the
      # floors mean what they say. A per-PR gate rather than a scheduled job,
      # because a floor stops being true the moment someone imports a newer
      # upstream symbol -- a code change, not the passage of time.
      # Also the oldest supported interpreter: a floor claim covers Python
      # too, and a dependency old enough to sit at its floor is the one most
      # likely to use something a newer Python removed.
      - name: Use the floor Python
        run: uv python install 3.10
      # `--refresh` because this job's whole claim is "what a consumer resolving
      # from scratch would get", and the runner's uv cache is shared across runs:
      # without it the resolution is made against whatever package list that
      # cache happens to hold, which can be hours behind the index. A sibling's
      # gate failed a floor raise as unsatisfiable while the index had been
      # serving the release for some time, and a cacheless resolve of the same
      # requirement succeeded. A stale listing makes this gate report the past,
      # in whichever direction happens to be wrong.
      - name: Resolve every declared dependency at its floor
        run: uv lock --resolution lowest-direct --python 3.10 --refresh
      # --frozen and --no-sync are load-bearing, not tidiness. uv records the
      # resolution mode in the lockfile and silently discards a lock resolved
      # in a different one -- a plain `uv sync` here prints "Ignoring existing
      # lockfile due to change in resolution mode: lowest-direct vs. highest"
      # and re-resolves at the newest versions, so the job reports the oldest
      # end while testing the newest. It did exactly that when first written.
      - name: Install exactly what was locked
        run: uv sync --frozen --all-groups --all-extras --python 3.10
      - name: Name the versions that produced
        run: uv pip list
      - name: Test
        run: uv run --no-sync pytest

      # The step above installs every extra, and an extra can hold a shared
      # dependency *above* the floor being claimed -- masking the lie rather
      # than exposing it. That is not hypothetical: reverting a sibling's
      # pydantic-ai floor to its old value and resolving with all extras kept
      # that dependency at 2.18 because another extra required it, and the
      # suite passed. The same revert on a plain base install resolved 2.0 and
      # failed at import, which is exactly how the original defect reached a
      # consumer.
      #
      # So the floor claim has to be checked on the install shape that has the
      # fewest constraints: the package alone, no extras, no dev group.
      - name: Import the package installed alone, at its floors
        run: |
          uv venv --python 3.10 .venv-floor
          uv pip install --python .venv-floor/bin/python --resolution lowest-direct --refresh -e .
          uv pip list --python .venv-floor/bin/python
          .venv-floor/bin/python - <<'PY'
          import django
          from django.conf import settings

          # This package imports ``django.contrib.admin`` at module scope, so
          # the app registry has to be able to load it. ``contenttypes`` is what
          # makes that possible -- ``LogEntry`` carries a ContentType foreign
          # key, and without the app the model cannot be registered at all.
          # ``auth`` is the other half of that pair (LogEntry -> AUTH_USER_MODEL);
          # the reference is lazy, so leaving it out happens to import today,
          # which is exactly the kind of accident this job exists to not rely on.
          # ``messages`` / ``sessions`` are request-cycle concerns, not import
          # ones, and a bare import needs no middleware.
          settings.configure(
              SECRET_KEY="x",
              INSTALLED_APPS=[
                  "django.contrib.contenttypes",
                  "django.contrib.auth",
                  "django.contrib.admin",
              ],
              DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          )
          django.setup()

          import django_admin_agent
          from django_admin_agent import AdminAgentServer, build_default_registry, staff_required

          # Touch the public surface rather than only the package root: an
          # upstream symbol that moved would be imported by a leaf module, and
          # importing the root alone can miss it.
          assert callable(build_default_registry)
          assert callable(staff_required)
          assert AdminAgentServer is not None
          print("BASE IMPORT OK", django.get_version(), django_admin_agent.__version__)
          PY

  test:
    name: ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0", "6.1"]
        exclude:
          # Django 4.2 supports Python 3.8–3.12
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.14"
            django-version: "4.2"
          # Django 5.0 supports Python 3.10–3.12
          - python-version: "3.13"
            django-version: "5.0"
          - python-version: "3.14"
            django-version: "5.0"
          # Django 5.1 supports Python 3.10–3.13
          - python-version: "3.14"
            django-version: "5.1"
          # Django 6.0 requires Python 3.12+
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
          # Django 6.1 requires Python 3.12+
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dev deps
        run: uv sync --all-groups --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install --reinstall-package django "django~=${{ matrix.django-version }}.0"
      - name: pytest
        run: |
          uv run --no-sync pytest \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}-django${{ matrix.django-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  bundle:
    name: the committed bundle is the pinned one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The vendored bundle is a build artefact fetched from npm, and the
      # committed file is what the wheel ships. This asserts the two are the
      # same bytes, on every PR.
      #
      # `tests/test_vendored_bundle.py` cannot: it greps the bundle for the
      # pinned version *string*, which a locally built sibling checkout
      # satisfies because its own source says the same version. So a `make
      # vendor-bundle` copy of whatever a developer had built passed every gate
      # and could land. Only a byte comparison against the published artefact
      # tells those apart.
      - name: make vendor-bundle-verify
        run: make vendor-bundle-verify

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      # The browsers are not pip-installable; Playwright fetches them, and
      # `--with-deps` adds the system libraries a headless Chromium needs on a
      # bare runner. About a minute, once per run.
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      # The only suite that loads the vendored bundle in a browser, and so the
      # only one that can tell a bundle that mounts from one that does not.
      # Every other job is Python: a bundle truncated past the 100KB floor, an
      # ESM export renamed under the sidebar's import, or a capability the
      # component dropped, all leave the unit suite, the version grep and the
      # size check green while the sidebar is dead on every admin page.
      #
      # That gap is why a bundle sat two minors behind with charts silently
      # discarded -- the tool call settled successfully, so the model reported a
      # chart nobody could see, and no gate here could have known.
      - name: make test-e2e
        run: make test-e2e
      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-output
          path: test-results/
          if-no-files-found: ignore

  coverage-badge:
    # Publishes a shields.io-compatible coverage.json to gh-pages so the README
    # badge reflects reality. Runs only on push to main, after the matrix has
    # produced an artifact we can read from.
    name: coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the parent commit so the gate step below can diff
          # version.py against ${{ github.event.before }}. The default
          # shallow checkout (depth 1) would make `git show "$before:…"`
          # fail with exit 128 and turn the whole job red.
          fetch-depth: 2
      # release.yml runs in parallel on the same push and owns gh-pages
      # publishing on release commits (it bundles coverage.json into the
      # mkdocs gh-deploy). If we also push here we get a second built-in
      # "pages build and deployment" run that the first one cancels. The
      # version-diff against ${{ github.event.before }} is the reliable
      # signal — release.yml's tag isn't pushed until after PyPI publish,
      # so a tag-existence check would race.
      - name: Skip when release.yml owns this push
        id: gate
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              # First push to main on a brand-new repo — no prior state to diff.
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          # `before` may not be in the local object DB if the push
          # contained more than one commit (fetch-depth: 2 only guarantees
          # HEAD + 1 parent). Try to fetch just that commit; if it's not
          # reachable, fall back to "don't skip" — better to double-push
          # to gh-pages once than to turn the pipeline red.
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --depth=1 origin "$before" 2>/dev/null || true
          fi
          old=""
          if git cat-file -e "$before:django_admin_agent/version.py" 2>/dev/null; then
              old="$(git show "$before:django_admin_agent/version.py" \
                     | awk -F'"' '/^__version__/ { print $2; exit }')"
          fi
          new="$(awk -F'"' '/^__version__/ { print $2; exit }' \
                 django_admin_agent/version.py)"
          if [[ -n "$old" && "$old" != "$new" ]]; then
              echo "Version bumped $old → $new; release.yml will deploy gh-pages."
              echo "skip=true" >> "$GITHUB_OUTPUT"
          else
              echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download canonical coverage artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Pin to one cell of the matrix — coverage is the same shape across
          # all cells and we only need one number.
          name: coverage-py3.13-django5.2
          path: coverage-artifact/
      - name: Render coverage.json
        if: steps.gate.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          tree = ET.parse("coverage-artifact/coverage.xml")
          pct = round(float(tree.getroot().attrib["line-rate"]) * 100, 1)
          if pct >= 95:
              color = "brightgreen"
          elif pct >= 85:
              color = "green"
          elif pct >= 70:
              color = "yellow"
          else:
              color = "red"
          payload = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{pct}%",
              "color": color,
          }
          with open("coverage.json", "w") as fh:
              json.dump(payload, fh)
              fh.write("\n")
          print(json.dumps(payload))
          PY
      - name: Publish coverage.json to gh-pages
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tmp="$(mktemp -d)"
          cp coverage.json "$tmp/coverage.json"

          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
              git worktree add gh-pages origin/gh-pages
              cp "$tmp/coverage.json" gh-pages/coverage.json
              cd gh-pages
              if [[ -n "$(git status --porcelain coverage.json)" ]]; then
                  git add coverage.json
                  git commit -m "coverage badge: update from ${GITHUB_SHA::7}"
                  git push origin HEAD:gh-pages
              else
                  echo "coverage.json unchanged, skipping push"
              fi
          else
              # First run before docs deploy. Lay down an orphan gh-pages with
              # just the badge file; the docs deploy will overwrite the rest.
              git worktree add --detach gh-pages
              cd gh-pages
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
              cp "$tmp/coverage.json" coverage.json
              git add coverage.json
              git commit -m "coverage badge: initial publish from ${GITHUB_SHA::7}"
              git push origin gh-pages
          fi

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan repo + history
        run: gitleaks git --redact --no-banner .

  tests-passed:
    name: tests
    if: always()
    needs: [lint, docs, floor, test, bundle, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "a required job failed"; exit 1
          fi
