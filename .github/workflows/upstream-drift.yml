# What a fresh install would get today, run on a schedule.
#
# ``uv.lock`` is what every other job resolves against, so a dependency can be
# unconstrained in ``pyproject.toml`` and still frozen everywhere it is actually
# tested. That gap is why the Django 6.1 break was invisible while the matrix
# was green: the cell that found it installed unpinned and resolved 6.1 by
# accident.
#
# This job closes it deliberately. It ignores the lock, resolves the newest
# versions ``pyproject.toml`` allows, and runs the suite — so an upstream
# release that breaks us is found by a scheduled run rather than by a consumer.
#
# It is also the control that makes dropping dependency ceilings safe. A
# ceiling is a guess about which future versions will break; this is a
# measurement of which ones do. Do not delete it to quieten a noisy week
# without replacing what it measures.
#
# Here that is not abstract. This package declares `django-ag-ui>=0.49` and, in
# the `[mcp]` extra, `djangorestframework-mcp-server>=0.30` — both open at the
# top. The `floor` job in `tests.yml` measures the oldest end of those windows
# per PR; this job measures the newest end. Between them they are what a
# ceiling used to assert by guessing.
#
# There is a second axis, and it is not a Python dependency at all: the web
# component this package **vendors**, pinned in the Makefile and fetched from
# npm. No Python resolve can see it, so the `bundle-pin` job below asks npm
# directly. Both axes report through their own issue label, because they fail for
# unrelated reasons and say unrelated things.
name: upstream drift

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly rather than nightly: the failure this guards
    # against is an upstream release, which is measured in weeks, and six repos
    # running nightly is six chances a day to learn nothing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Actions are pinned to a commit SHA rather than a tag: a tag is mutable, and an
# action owner (or anyone who takes over the account) can silently repoint one at
# new code that then runs with this workflow's token. The trailing version comment
# is not decoration -- Dependabot reads it to know which release the SHA is, and
# rewrites both together when a newer one ships.
jobs:
  # The second axis, and the one the job above structurally cannot see. The
  # vendored bundle is pinned in the Makefile and fetched from **npm**, so no
  # Python resolve touches it: `uv lock --upgrade` can be perfectly current while
  # the component we actually ship is months old. `tests/test_vendored_bundle.py`
  # does not close that gap either — it asserts the pin and the bundle agree
  # *with each other*, which a stale-but-consistent pair does happily. That is how
  # the pin reached four minors behind unnoticed, and then two more after it.
  bundle-pin:
    name: is the vendored bundle pin behind npm?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Compare the pinned bundle with the latest published component
        id: compare
        run: |
          set -euo pipefail
          package="$(sed -n 's/^WEB_COMPONENT_PKG := //p' Makefile)"
          pinned="$(sed -n 's/^WEB_COMPONENT_VERSION := //p' Makefile)"
          latest="$(npm view "$package" version)"
          echo "package=$package pinned=$pinned latest=$latest"
          {
            echo "package=$package"
            echo "pinned=$pinned"
            echo "latest=$latest"
          } >>"$GITHUB_OUTPUT"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::$package is at $latest; this repo vendors $pinned."
            exit 1
          fi

      - name: Open or update an issue on drift
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Its own label and title: the resolve job's issue tells a different
            // story, and one overwriting the other would lose whichever ran second.
            const pinned = ${{ toJSON(steps.compare.outputs.pinned) }};
            const latest = ${{ toJSON(steps.compare.outputs.latest) }};
            const title = "vendored bundle: the web-component pin is behind npm";
            const body = [
              `This repo vendors \`${pinned}\`; npm publishes \`${latest}\`.`,
              "",
              "Nothing else can see this. The unpinned Python resolve does not touch",
              "npm, and the bundle test only asserts that the pin and the committed",
              "bundle agree with each other — which a stale pair does.",
              "",
              "To adopt: bump `WEB_COMPONENT_VERSION` in the `Makefile`, run",
              "`make vendor-bundle-release`, and release. Read the component's",
              "changelog first: a bundle bump can carry chrome changes as well as",
              "fixes, and the release notes should say so.",
              "",
              "To decline: pin deliberately and say why here, so the next run has an",
              "answer rather than a repeat.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "bundle-drift",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["bundle-drift"],
              });
            }

  resolve-latest:
    name: resolve unpinned + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      # One cell, not the matrix. The matrix answers "does this combination
      # work"; this answers "has an upstream moved under us", and the newest
      # supported Python is where a new release lands first.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve the newest versions pyproject allows
        run: uv lock --upgrade

      - name: Report what changed against the committed lock
        # Informational, and the most useful line in the log when this fails:
        # it names the upgrade that broke the build.
        run: git --no-pager diff --stat uv.lock || true

      - name: Install
        # ``--all-extras`` is load-bearing here rather than tidy: the second
        # open window, ``djangorestframework-mcp-server``, is reachable only
        # through the ``[mcp]`` extra, so a base install would leave half of
        # what this job exists to measure uninstalled.
        run: uv sync --all-groups --all-extras

      - name: Show the resolved versions
        run: uv pip list

      - name: Test
        # The repo's default ``addopts`` already carry ``--ignore=tests/e2e``,
        # so this is the unit suite (with its coverage gate) and needs no
        # browser download, even though ``--all-groups`` installed Playwright.
        # The browser suite runs per-PR in the `e2e` job in `tests.yml`, against
        # the locked Playwright; what stays unmeasured is that job's own
        # dependencies drifting. Those pin nothing this package ships, so the
        # trade is deliberate — but do not read a green run as covering them.
        run: uv run pytest

      - name: Open or update an issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "upstream drift: the unpinned resolve is failing";
            const body = [
              "The weekly unpinned resolve failed. A dependency released a version",
              "that `pyproject.toml` admits and the suite does not survive.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "The `git diff --stat uv.lock` step in that run names what moved.",
              "",
              "Fix forward (adopt the new version) or add a floor/ceiling that says",
              "why, but do not silence the job — it is the control that lets this",
              "repo declare open-ended dependency windows.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "upstream-drift",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["upstream-drift"],
              });
            }
